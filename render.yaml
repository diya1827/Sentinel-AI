# Render Blueprint — deploys the Sentinel AI backend as a Docker web service.
# Import at https://dashboard.render.com/blueprints (New → Blueprint → pick this repo).
services:
  - type: web
    name: sentinel-ai-backend
    runtime: docker
    plan: free                     # 512MB RAM, spins down when idle
    rootDir: backend               # build context + Dockerfile live here
    healthCheckPath: /health
    autoDeploy: true               # redeploy on push to the connected branch
    envVars:
      # Secrets — set the actual values in the Render dashboard (not committed).
      - key: LLM_API_KEY
        sync: false
      # Redis connection URL (e.g. Upstash rediss://...). Blank falls back to an
      # in-process store; set this for the real queue across restarts.
      - key: REDIS_URL
        sync: false
      # Free tier is 512MB: one scan at a time, one scanner at a time, so peak
      # memory ≈ the app + a single scanner process (avoids OOM crashes).
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: SCANNER_CONCURRENCY
        value: "1"
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: SEMGREP_CONFIG
        value: p/default
      - key: SEMGREP_MAX_MEMORY
        value: "250"
      - key: SEMGREP_JOBS
        value: "1"
      - key: LLM_TIMEOUT
        value: "120"
      - key: SCAN_WORKSPACE_DIR
        value: /tmp/sentinel-scans
      # Allow the Vercel frontend (prod + preview URLs) to call the API.
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      # Render injects PORT automatically; the Dockerfile CMD honors it.
